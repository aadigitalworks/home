<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AA DigitalWorks Blog Admin</title>
<style>
body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 20px; }
.container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 10px; }
h1, h2 { text-align: center; }
input, textarea { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #ccc; }
button { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; background: #1a6bb3; color: white; }
#status { margin: 10px 0; font-weight: bold; text-align: center; }
.image-preview { width: 100%; height: 200px; border: 2px dashed #ccc; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }
.image-preview img { max-width: 100%; max-height: 100%; }
</style>
</head>
<body>
<div class="container">
<h1>AA DigitalWorks Blog Admin</h1>

<div id="login-section">
<h2>Admin Login</h2>
<input type="text" id="adminUser" placeholder="Username">
<input type="password" id="adminPass" placeholder="Password">
<button id="loginBtn">Login</button>
</div>

<div id="post-section" style="display:none;">
<h2>Create New Post</h2>
<input type="text" id="title" placeholder="Post Title">
<input type="text" id="slug" placeholder="URL Slug (e.g., my-new-post)">
<textarea id="description" placeholder="Short Description"></textarea>
<input type="text" id="tags" placeholder="Tags (comma separated)">
<input type="text" id="image" placeholder="Image URL">
<textarea id="body" placeholder="Post Content in Markdown" rows="15"></textarea>
<button id="publishBtn">Publish Post</button>
</div>

<div id="status">Please log in.</div>
</div>

<script>
// Simple local storage authentication (replace with proper auth in production)
const ADMIN_USER = "admin";
const ADMIN_PASS = "password123"; // Change this!

document.getElementById('loginBtn').addEventListener('click', () => {
    const username = document.getElementById('adminUser').value;
    const password = document.getElementById('adminPass').value;
    
    if (username === ADMIN_USER && password === ADMIN_PASS) {
        document.getElementById('login-section').style.display = 'none';
        document.getElementById('post-section').style.display = 'block';
        document.getElementById('status').textContent = '✅ Logged in successfully!';
        localStorage.setItem('adminLoggedIn', 'true');
    } else {
        document.getElementById('status').textContent = '❌ Invalid credentials!';
    }
});

// Check if already logged in
if (localStorage.getItem('adminLoggedIn') === 'true') {
    document.getElementById('login-section').style.display = 'none';
    document.getElementById('post-section').style.display = 'block';
}

document.getElementById('publishBtn').addEventListener('click', () => {
    const title = document.getElementById('title').value;
    const slug = document.getElementById('slug').value;
    const description = document.getElementById('description').value;
    const tags = document.getElementById('tags').value;
    const image = document.getElementById('image').value;
    const body = document.getElementById('body').value;
    
    if (!title || !slug || !body) {
        document.getElementById('status').textContent = '❌ Please fill all required fields!';
        return;
    }
    
    // Create post content with proper front matter
    const postContent = `---
layout: post
title: "${title.replace(/"/g, '\\"')}"
date: ${new Date().toISOString().split('T')[0]}
description: "${description.replace(/"/g, '\\"')}"
tags: [${tags.split(',').map(tag => tag.trim()).join(', ')}]
image: "${image}"
---

${body}`;

    // Create download link
    const blob = new Blob([postContent], { type: 'text/markdown' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${new Date().toISOString().split('T')[0]}-${slug}.md`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    
    document.getElementById('status').textContent = '✅ Post created and downloaded!';
    
    // Clear form
    document.getElementById('title').value = '';
    document.getElementById('slug').value = '';
    document.getElementById('description').value = '';
    document.getElementById('tags').value = '';
    document.getElementById('image').value = '';
    document.getElementById('body').value = '';
});
</script>
</body>
</html>
