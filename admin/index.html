<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AA DigitalWorks Blog Admin</title>
<style>
body { font-family: Arial,sans-serif; background:#f4f4f4; margin:0; padding:20px;}
.container {max-width:900px;margin:auto;background:white;padding:20px;border-radius:10px;}
h1,h2{text-align:center;}
input,textarea{width:100%;padding:10px;margin:10px 0;border-radius:5px;border:1px solid #ccc;}
button{padding:10px 20px;border:none;border-radius:5px;cursor:pointer;background:#1a6bb3;color:white;}
#status{margin:10px 0;font-weight:bold;text-align:center;}
.image-preview{width:100%;height:200px;border:2px dashed #ccc;display:flex;align-items:center;justify-content:center;margin-bottom:10px;}
.image-preview img{max-width:100%;max-height:100%;}
.radio-group{display:flex;gap:20px;margin-bottom:10px;}
</style>
</head>
<body>
<div class="container">
<h1>AA DigitalWorks Blog Admin</h1>

<!-- LOGIN -->
<div id="login-section">
<h2>Admin Login</h2>
<input type="text" id="adminUser" placeholder="Username">
<input type="password" id="adminPass" placeholder="Password">
<button id="loginBtn">Login</button>
</div>

<!-- POST CREATION -->
<div id="post-section" style="display:none;">
<h2>Create New Post</h2>
<input type="text" id="title" placeholder="Post Title">
<input type="text" id="slug" placeholder="URL Slug">
<textarea id="description" placeholder="Short Description"></textarea>
<input type="text" id="tags" placeholder="Tags (comma separated)">

<h3>Post Image</h3>
<div class="radio-group">
  <label><input type="radio" name="imageOption" value="upload" checked> Upload Image</label>
  <label><input type="radio" name="imageOption" value="link"> Use Image URL</label>
</div>

<div id="uploadSection">
  <div class="image-preview" id="imagePreview">Image preview here</div>
  <input type="file" id="imageUpload">
</div>

<div id="linkSection" style="display:none;">
  <input type="text" id="imageLink" placeholder="https://example.com/image.jpg">
</div>

<textarea id="body" placeholder="Post Content in Markdown"></textarea>
<button id="publishBtn">Publish Post</button>
</div>

<div id="status">Please log in.</div>
</div>

<script>
const workerUrl = 'https://aadigitalworks-blog-worker.aadigitalworkss.workers.dev'; // <-- Your Worker URL

let loginInfo = null;

// LOGIN
document.getElementById('loginBtn').addEventListener('click', async()=>{
  const username = document.getElementById('adminUser').value;
  const password = document.getElementById('adminPass').value;
  document.getElementById('status').textContent='Logging in...';

  try{
    const res = await fetch(workerUrl,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({action:'login', username, password})
    });

    let data;
    try { data = await res.json(); }
    catch(e){ const text = await res.text(); document.getElementById('status').textContent='❌ Worker returned invalid JSON:\n'+text; return; }

    if(data.success){
      document.getElementById('login-section').style.display='none';
      document.getElementById('post-section').style.display='block';
      document.getElementById('status').textContent='✅ Logged in successfully!';
      loginInfo={username,password};
    } else {
      document.getElementById('status').textContent='❌ ' + (data.message || 'Login failed');
    }

  } catch(err){
    document.getElementById('status').textContent='❌ Network/Worker error: '+err.message;
  }
});

// IMAGE PREVIEW
const imageUpload=document.getElementById('imageUpload');
const imagePreview=document.getElementById('imagePreview');

imageUpload.addEventListener('change',()=>{
  const file=imageUpload.files[0];
  if(file){
    const reader=new FileReader();
    reader.onload=e=>{
      imagePreview.innerHTML=`<img src="${e.target.result}">`;
    };
    reader.readAsDataURL(file);
  }
});

// Toggle between upload or link
const imageOptionRadios=document.querySelectorAll('input[name="imageOption"]');
const uploadSection=document.getElementById('uploadSection');
const linkSection=document.getElementById('linkSection');

imageOptionRadios.forEach(radio=>{
  radio.addEventListener('change',()=>{
    if(radio.value==='upload'){
      uploadSection.style.display='block';
      linkSection.style.display='none';
    } else {
      uploadSection.style.display='none';
      linkSection.style.display='block';
    }
  });
});

// PUBLISH POST
document.getElementById('publishBtn').addEventListener('click', async()=>{
  if(!loginInfo){ 
    document.getElementById('status').textContent='❌ Please login first!'; 
    return; 
  }

  const selectedOption=document.querySelector('input[name="imageOption"]:checked').value;
  let finalImage='';
  let imageBase64='';

  if(selectedOption==='upload'){
    const file=imageUpload.files[0];
    if(file){
      finalImage=`/assets/images/blog/${file.name}`;
      const reader=new FileReader();
      reader.onload=async e=>{
        imageBase64=e.target.result.split(',')[1]; // base64 content
        await sendPost(finalImage,imageBase64);
      };
      reader.readAsDataURL(file);
      return; // wait for file reader
    }
  } else {
    finalImage=document.getElementById('imageLink').value;
  }

  await sendPost(finalImage,imageBase64);
});

async function sendPost(finalImage,imageBase64){
  const postData={
    title: document.getElementById('title').value,
    slug: document.getElementById('slug').value,
    description: document.getElementById('description').value,
    tags: document.getElementById('tags').value,
    image: finalImage,
    image_base64: imageBase64,
    body: document.getElementById('body').value,
    date: new Date().toISOString().split('T')[0]
  };

  document.getElementById('status').textContent='Publishing...';

  try{
    const res=await fetch(workerUrl,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        action:'publish',
        username:loginInfo.username,
        password:loginInfo.password,
        postData
      })
    });

    let data;
    try{ data=await res.json(); }
    catch(e){ const text=await res.text(); document.getElementById('status').textContent='❌ Worker returned invalid JSON:\n'+text; return; }

    if(data.success){
      document.getElementById('status').textContent='✅ Post published successfully!';
      document.getElementById('title').value='';
      document.getElementById('slug').value='';
      document.getElementById('description').value='';
      document.getElementById('tags').value='';
      document.getElementById('body').value='';
      imagePreview.innerHTML='Image preview here';
      document.getElementById('imageLink').value='';
      imageUpload.value='';
    } else {
      document.getElementById('status').textContent='❌ '+(data.message||'Error publishing post');
    }

  }catch(err){
    document.getElementById('status').textContent='❌ Network/Worker error: '+err.message;
  }
}
</script>
</body>
</html>
