    // 🔍 DETECT LANGUAGE FROM URL PARAMETER

    function detectLanguage() {
        const urlParams = new URLSearchParams(window.location.search);
        const langParam = urlParams.get('lang');
        const referrer = document.referrer || '';
        
        // 1️⃣ الأولوية القصوى: باراميتر ?lang= في الرابط
        if (langParam === 'ar') {
            return 'ar';
        } else if (langParam === 'en') {
            return 'en';
        }
        
        // 2️⃣ التحقق من referrer إذا لم يوجد باراميتر
        if (referrer.includes('/ar') || 
            referrer.includes('/ar/')||
            referrer.includes('ar.') ||
            referrer.includes('_ar') ||
            referrer.includes('.sa') || 
            referrer.includes('.ae') || 
            referrer.includes('.eg')) {
            return 'ar';
        }
        
        // 3️⃣ القيمة الافتراضية: الإنجليزية
        return 'en';
    }

            featureDiv.className = 'feature-item';
            featureDiv.innerHTML = `<i class="fas ${feature.icon}"></i><span>${feature.text}</span>`;
            featuresGrid.appendChild(featureDiv);
        });

        // إذا كان المشروع موجوداً، قم بتحديث بياناته
        if (project) {
            // العنوان
            document.getElementById('projectHeading').textContent = project.title[lang];
            document.title = `${project.title[lang]} - AA DigitalWorks ${lang === 'ar' ? 'مشروع' : 'Project'}`;
            document.getElementById('projectTitle').textContent = `${project.title[lang]} - AA DigitalWorks`;
            
            // الوصف
            document.getElementById('projectText').textContent = project.description[lang];
            document.getElementById('projectDescription').setAttribute('content', project.description[lang]);
            
            // Open Graph
            document.querySelector('meta[property="og:title"]').setAttribute('content', project.title[lang]);
            document.querySelector('meta[property="og:description"]').setAttribute('content', project.description[lang]);
            document.querySelector('meta[property="og:image"]').setAttribute('content', project.image);
            
            // الصورة
            document.getElementById('projectMainImage').src = project.image;
            document.getElementById('projectMainImage').alt = project.title[lang];
            
            // التاجات
            const tagsContainer = document.getElementById('projectTags');
            tagsContainer.innerHTML = '';
            (project.tags[lang] || project.tags.en).forEach(tag => {
                const tagSpan = document.createElement('span');
                tagSpan.className = 'tag';
                tagSpan.textContent = tag;
                tagsContainer.appendChild(tagSpan);
            });

            // JSON-LD (نحتفظ بالإنجليزية للمحركات)
            const schema = {
                "@context": "https://schema.org",
                "@type": "CreativeWork",
                "name": project.title.en,
                "description": project.description.en,
                "url": project.link,
                "image": project.image,
                "about": project.tags.en.join(", "),
                "creator": {
                    "@type": "Organization",
                    "name": "AA DigitalWorks"
                }
            };
            document.getElementById('projectSchema').textContent = JSON.stringify(schema, null, 2);
        }
    }

// ↩️ BACK NAVIGATION - WITH SESSION STORAGE
// ================================================
function goBack() {
    // First try to get stored previous page
    const storedPrevious = sessionStorage.getItem('previousPage');
    
    if (storedPrevious) {
        window.location.href = storedPrevious;
        sessionStorage.removeItem('previousPage'); // Clear after use
    }
    // Then try referrer
    else if (document.referrer && document.referrer.includes(window.location.hostname)) {
        window.location.href = document.referrer;
    }
    // Then browser history
    else if (window.history.length > 1) {
        window.history.back();
    }
    // Finally, fallback based on language
    else {
        const urlParams = new URLSearchParams(window.location.search);
        const langParam = urlParams.get('lang');
        
        if (langParam === 'ar' || currentLang === 'ar') {
            window.location.href = '/ar';
        } else {
            window.location.href = '/';
        }
    }
}
