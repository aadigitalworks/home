---
layout: default
title: "Home"
---
<section class="latest-post container">
  <h2>Latest Post</h2>

  {% assign latest_post = site.posts | first %}
  <div class="post-card">
    {% if latest_post.image %}
      <img src="{{ latest_post.image }}" alt="{{ latest_post.title }}" class="post-image">
    {% endif %}

    <h3 class="post-title">
      <a href="{{ latest_post.url }}">{{ latest_post.title }}</a>
    </h3>

    <p class="post-description">{{ latest_post.description }}</p>

    <div class="post-preview">
      {{ latest_post.content | markdownify | truncatewords: 50 }}
    </div>

    <a href="{{ latest_post.url }}" class="btn btn-primary">Read More</a>
  </div>
</section>
