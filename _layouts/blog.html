<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1877f2;
      --primary-dark: #155bb5;
      --light: #f8f9fa;
      --gray: #6c757d;
    }
    body { font-family: 'Poppins', sans-serif; }
    .navbar-brand { font-weight: 700; color: var(--primary) !important; }
  </style>
</head>
<body>
  <header class="site-header">
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
      <div class="container">
        <a class="navbar-brand" href="{{ '/' | relative_url }}">
          <i class="fas fa-digital-tachograph me-2"></i>AA DigitalWorks
        </a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ml-auto">
            <li class="nav-item"><a class="nav-link" href="{{ '/' | relative_url }}">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="{{ '/services/' | relative_url }}">Services</a></li>
            <li class="nav-item active"><a class="nav-link" href="{{ '/blog/' | relative_url }}">Blog</a></li>
            <li class="nav-item"><a class="nav-link" href="{{ '/about/' | relative_url }}">About</a></li>
            <li class="nav-item"><a class="nav-link" href="{{ '/contact/' | relative_url }}">Contact</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  {{ content }}

  <footer class="bg-dark text-white py-4 mt-5">
    <div class="container text-center">
      <p>&copy; 2025 AA DigitalWorks. All rights reserved.</p>
      <div class="social-links">
        <a href="#" class="text-light mx-2"><i class="fab fa-facebook-f"></i></a>
        <a href="#" class="text-light mx-2"><i class="fab fa-twitter"></i></a>
        <a href="#" class="text-light mx-2"><i class="fab fa-linkedin-in"></i></a>
        <a href="#" class="text-light mx-2"><i class="fab fa-instagram"></i></a>
      </div>
    </div>
  </footer>

  <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
</body>
</html>
