name: Create Post

on:
  repository_dispatch:
    types: [new-post]

jobs:
  create-post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Create _posts folder
        run: mkdir -p _posts

      - name: Create post file
        run: |
          echo "${{ github.event.client_payload.body }}" > _posts/${{ github.event.client_payload.date }}-${{ github.event.client_payload.slug }}.md
        shell: bash

      - name: Save image (optional)
        if: ${{ github.event.client_payload.image }}
        run: |
          mkdir -p images/blog
          echo "${{ github.event.client_payload.image }}" | base64 --decode > images/blog/${{ github.event.client_payload.imageName }}

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "New post: ${{ github.event.client_payload.title }}" || echo "No changes to commit"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} HEAD:main