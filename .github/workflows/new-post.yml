name: Create Post

on:
  repository_dispatch:
    types: [new-post]
  workflow_dispatch: # manual trigger

jobs:
  create-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          persist-credentials: false

      - name: Create _posts folder
        run: mkdir -p _posts

      - name: Upload image to repo
        if: ${{ github.event.client_payload.image != '' }}
        run: |
          IMAGE_FILE="${{ github.event.client_payload.image }}"
          IMAGE_PATH="assets/images/blog/$(basename "$IMAGE_FILE")"
          mkdir -p "$(dirname "$IMAGE_PATH")"
          # Save image from base64 payload
          echo "${{ github.event.client_payload.image_base64 }}" | base64 --decode > "$IMAGE_PATH"

      - name: Create post file safely
        run: |
          SAFE_SLUG=$(echo "${{ github.event.client_payload.slug }}" | tr ' ' '-' | tr -cd '[:alnum:]-')
          FILE_NAME="_posts/${{ github.event.client_payload.date }}-${SAFE_SLUG}.md"

          echo "---" > "$FILE_NAME"
          echo "title: \"${{ github.event.client_payload.title }}\"" >> "$FILE_NAME"
          echo "description: \"${{ github.event.client_payload.description }}\"" >> "$FILE_NAME"

          # If image exists, link it; else leave empty
          if [ "${{ github.event.client_payload.image }}" != "" ]; then
            IMAGE_NAME=$(basename "${{ github.event.client_payload.image }}")
            echo "image: \"/assets/images/blog/$IMAGE_NAME\"" >> "$FILE_NAME"
          else
            echo "image: \"\"" >> "$FILE_NAME"
          fi

          echo "tags: [${{ github.event.client_payload.tags }}]" >> "$FILE_NAME"
          echo "layout: post" >> "$FILE_NAME"
          echo "date: ${{ github.event.client_payload.date }}" >> "$FILE_NAME"
          echo "---" >> "$FILE_NAME"
          echo "" >> "$FILE_NAME"
          echo "${{ github.event.client_payload.body }}" >> "$FILE_NAME"

      - name: Commit & push
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git config user.name "AA DigitalWorks Bot"
          git config user.email "aadigitalworkss@gmail.com"
          git remote set-url origin https://x-access-token:${PAT_TOKEN}@github.com/${{ github.repository }}.git
          git add _posts/*
          git add assets/images/blog/*
          git commit -m "🆕 New post: ${{ github.event.client_payload.title }}" || echo "No changes to commit"
          git push origin HEAD:main
