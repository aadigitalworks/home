name: Create Post

on:
  repository_dispatch:
    types: [new-post]

jobs:
  create-post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Create _posts folder
        run: mkdir -p _posts

      - name: Commit & push
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _posts/*
          git commit -m "New post: ${{ github.event.client_payload.title }}" || echo "No changes to commit"
          # Force push using PAT instead of default GITHUB_TOKEN
          git push https://x-access-token:${PAT_TOKEN}@github.com/${{ github.repository }}.git HEAD:main