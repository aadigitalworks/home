name: Create Post

on:
  repository_dispatch:
    types: [new-post]
  workflow_dispatch:

jobs:
  create-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Create folders
        run: |
          mkdir -p _posts
          mkdir -p assets/images/blog

      - name: Handle uploaded image
        id: image
        run: |
          IMAGE_BASE64="${{ github.event.client_payload.image_base64 }}"
          IMAGE_NAME="${{ github.event.client_payload.image_name }}"
          IMAGE_LINK="${{ github.event.client_payload.image_link }}"

          if [ -n "$IMAGE_BASE64" ] && [ -n "$IMAGE_NAME" ]; then
            echo "$IMAGE_BASE64" | base64 --decode > "assets/images/blog/$IMAGE_NAME"
            echo "✅ Image saved to assets/images/blog/$IMAGE_NAME"
            echo "image_path=/assets/images/blog/$IMAGE_NAME" >> $GITHUB_OUTPUT
          elif [ -n "$IMAGE_LINK" ]; then
            echo "ℹ️ Using external image link: $IMAGE_LINK"
            echo "image_path=$IMAGE_LINK" >> $GITHUB_OUTPUT
          else
            echo "⚠️ No image provided"
            echo "image_path=" >> $GITHUB_OUTPUT
          fi

      - name: Create post file
        run: |
          SAFE_SLUG=$(echo "${{ github.event.client_payload.slug }}" | tr ' ' '-' | tr -cd '[:alnum:]-')
          FILE_NAME="_posts/${{ github.event.client_payload.date }}-${SAFE_SLUG}.md"

          echo "---" > "$FILE_NAME"
          echo "title: \"${{ github.event.client_payload.title }}\"" >> "$FILE_NAME"
          echo "description: \"${{ github.event.client_payload.description }}\"" >> "$FILE_NAME"
          echo "image: \"${{ steps.image.outputs.image_path }}\"" >> "$FILE_NAME"
          echo "tags: [${{ github.event.client_payload.tags }}]" >> "$FILE_NAME"
          echo "layout: post" >> "$FILE_NAME"
          echo "date: ${{ github.event.client_payload.date }}" >> "$FILE_NAME"
          echo "---" >> "$FILE_NAME"
          echo "" >> "$FILE_NAME"
          echo "${{ github.event.client_payload.body }}" >> "$FILE_NAME"

          echo "✅ Post created at $FILE_NAME"

      - name: Commit & push changes
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git config user.name "AA DigitalWorks Bot"
          git config user.email "aadigitalworkss@gmail.com"
          git remote set-url origin https://x-access-token:${PAT_TOKEN}@github.com/${{ github.repository }}.git

          git add _posts/*
          git add assets/images/blog/* || echo "No image to add"

          git commit -m "🆕 New post: ${{ github.event.client_payload.title }}" || echo "No changes to commit"
          git push origin HEAD:main
