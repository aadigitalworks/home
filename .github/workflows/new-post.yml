name: Create Post

on:
  repository_dispatch:
    types: [new-post]

jobs:
  create-post:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          persist-credentials: false  

      - name: Create _posts folder
        run: mkdir -p _posts

      - name: Create post file (safe YAML front matter)
        run: |
          # Make slug safe for filename
          SAFE_SLUG=$(echo "${{ github.event.client_payload.slug }}" | tr ' ' '-' | tr -cd '[:alnum:]-')
          FILE_NAME="_posts/${{ github.event.client_payload.date }}-${SAFE_SLUG}.md"

          # Write front matter and content
          cat << EOF > "$FILE_NAME"
---
title: "${{ github.event.client_payload.title }}"
description: "${{ github.event.client_payload.description }}"
image: "${{ github.event.client_payload.image }}"
tags: [${{ github.event.client_payload.tags }}]
layout: post
date: ${{ github.event.client_payload.date }}
---

${{ github.event.client_payload.body }}
EOF

      - name: Commit & push
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git config user.name "AA DigitalWorks Bot"
          git config user.email "aadigitalworkss@gmail.com"
          git remote set-url origin https://x-access-token:${PAT_TOKEN}@github.com/${{ github.repository }}.git
          git add _posts/*
          git commit -m "🆕 New post: ${{ github.event.client_payload.title }}" || echo "No changes to commit"
          git push origin HEAD:main
