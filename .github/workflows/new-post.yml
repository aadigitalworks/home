name: Create Post

on:
  repository_dispatch:
    types: [new-post]

jobs:
  create-post:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          persist-credentials: false  

      - name: Create _posts folder
        run: mkdir -p _posts

      - name: Create post file (safe for spaces)
        run: |
          SAFE_SLUG=$(echo "${{ github.event.client_payload.slug }}" | tr ' ' '-' | tr -cd '[:alnum:]-')
          FILE_NAME="_posts/${{ github.event.client_payload.date }}-${SAFE_SLUG}.md"

          {
            echo "---"
            echo "title: \"${{ github.event.client_payload.title }}\""
            echo "description: \"${{ github.event.client_payload.description }}\""
            echo "image: \"${{ github.event.client_payload.image }}\""
            echo "tags: [${{ github.event.client_payload.tags }}]"
            echo "layout: post"
            echo "date: ${{ github.event.client_payload.date }}"
            echo "---"
            echo ""
            echo "${{ github.event.client_payload.body }}"
          } > "$FILE_NAME"
        shell: bash

      - name: Commit & push
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git config user.name "AA DigitalWorks Bot"
          git config user.email "aadigitalworkss@gmail.com"
          git remote set-url origin https://x-access-token:${PAT_TOKEN}@github.com/${{ github.repository }}.git
          git add _posts/*
          git commit -m "New post: ${{ github.event.client_payload.title }}" || echo "No changes to commit"
          git push origin HEAD:main
