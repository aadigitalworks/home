name: Create Post with Image

on:
  repository_dispatch:
    types: [new-post]  # Only triggers for new posts

jobs:
  create-post:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          persist-credentials: false

      - name: Create folders
        run: |
          mkdir -p _posts
          mkdir -p images/blog

      - name: Save post and image
        run: |
          SAFE_SLUG=$(echo "${{ github.event.client_payload.slug }}" | tr ' ' '-' | tr -cd '[:alnum:]-')
          POST_FILE="_posts/${{ github.event.client_payload.date }}-${SAFE_SLUG}.md"
          IMAGE_FILE="images/blog/${SAFE_SLUG}.jpg"

          if [ ! -z "${{ github.event.client_payload.image_base64 }}" ]; then
            echo "${{ github.event.client_payload.image_base64 }}" | base64 --decode > "$IMAGE_FILE"
          fi

          IMAGE_PATH="/${IMAGE_FILE}"

          cat <<EOF > "$POST_FILE"
---
title: "${{ github.event.client_payload.title }}"
slug: "${{ github.event.client_payload.slug }}"
description: "${{ github.event.client_payload.description }}"
tags: ["${{ github.event.client_payload.tags }}"]
layout: post
date: ${{ github.event.client_payload.date }}
image: "${IMAGE_PATH}"
---

${{ github.event.client_payload.body }}
EOF
        shell: bash

      - name: Commit & push
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git config user.name "AA DigitalWorks Bot"
          git config user.email "aadigitalworkss@gmail.com"
          git remote set-url origin https://x-access-token:${PAT_TOKEN}@github.com/${{ github.repository }}.git
          git add _posts/* images/blog/*
          git commit -m "🆕 New post: ${{ github.event.client_payload.title }}" || echo "No changes to commit"
          git push origin HEAD:main
