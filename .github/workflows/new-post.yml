name: Create Post

on:
  repository_dispatch:
    types: [new-post]
  workflow_dispatch:

jobs:
  create-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          persist-credentials: false

      - name: Create folders
        run: |
          mkdir -p _posts
          mkdir -p assets/images/blog

      - name: Save uploaded image
        run: |
          IMAGE_PATH="${{ github.event.client_payload.image }}"
          IMAGE_BASE64="${{ github.event.client_payload.image_base64 }}"
          if [ -n "$IMAGE_PATH" ] && [ -n "$IMAGE_BASE64" ]; then
            IMAGE_FILE=$(basename "$IMAGE_PATH")
            echo "$IMAGE_BASE64" | base64 --decode > "assets/images/blog/$IMAGE_FILE"
            echo "Image saved: assets/images/blog/$IMAGE_FILE"
          fi

      - name: Create post file
        run: |
          SAFE_SLUG=$(echo "${{ github.event.client_payload.slug }}" | tr ' ' '-' | tr -cd '[:alnum:]-')
          FILE_NAME="_posts/${{ github.event.client_payload.date }}-${SAFE_SLUG}.md"

          echo "---" > "$FILE_NAME"
          echo "title: \"${{ github.event.client_payload.title }}\"" >> "$FILE_NAME"
          echo "description: \"${{ github.event.client_payload.description }}\"" >> "$FILE_NAME"

          if [ -n "${{ github.event.client_payload.image }}" ]; then
            IMAGE_FILE=$(basename "${{ github.event.client_payload.image }}")
            echo "image: \"/assets/images/blog/$IMAGE_FILE\"" >> "$FILE_NAME"
          elif [ -n "${{ github.event.client_payload.image_link }}" ]; then
            echo "image: \"${{ github.event.client_payload.image_link }}\"" >> "$FILE_NAME"
          else
            echo "image: \"\"" >> "$FILE_NAME"
          fi

          echo "tags: [${{ github.event.client_payload.tags }}]" >> "$FILE_NAME"
          echo "layout: post" >> "$FILE_NAME"
          echo "date: ${{ github.event.client_payload.date }}" >> "$FILE_NAME"
          echo "---" >> "$FILE_NAME"
          echo "" >> "$FILE_NAME"
          echo "${{ github.event.client_payload.body }}" >> "$FILE_NAME"

      - name: Commit & push changes
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git config user.name "AA DigitalWorks Bot"
          git config user.email "aadigitalworkss@gmail.com"
          git remote set-url origin https://x-access-token:${PAT_TOKEN}@github.com/${{ github.repository }}.git
          git add _posts/*
          git add assets/images/blog/*
          git commit -m "🆕 New post: ${{ github.event.client_payload.title }}" || echo "No changes to commit"
          git push origin HEAD:main
